#####################################################################
#    Cartographer CAN - v4 (USB Diagnostic Mode)
#####################################################################

[mcu scanner]
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_1E0046001850303655333520-if00

[scanner]
mcu: scanner
x_offset: 0
y_offset: 21.1
sensor: cartographer
sensor_alt: carto
#calibration_method: touch   - uz nebude porebny
speed: 40.0
mesh_runs: 2

[bed_mesh]
zero_reference_position: 175, 175
speed: 300
horizontal_move_z: 5
mesh_min: 40, 40
mesh_max: 310, 310
probe_count: 30, 30
algorithm: bicubic

[temperature_sensor cartographer_mcu]
sensor_type: temperature_mcu
sensor_mcu: scanner
min_temp: 5
max_temp: 105

[adxl345]
cs_pin: scanner:PA0
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20
