#####################################################################
#      X Stepper Settings - SLOT 1 (48V TMC5160)
#####################################################################

[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
rotation_distance: 40
microsteps: 64            
full_steps_per_rotation: 400  # 0.9° motory
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 40          # Pre sensorless ideálne 40-60
homing_retract_dist: 0    # MUST BE 0

[tmc5160 stepper_x]
cs_pin: PC13
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: False
run_current: 1.1
sense_resistor: 0.075
# SGT (StallGuard Threshold): Ladenie citlivosti
# Začni na 1, ak hneď zastane, choď nižšie (napr. -10), ak narazí, choď vyššie (napr. 10)
driver_SGT: 1             
diag1_pin: ^!PF4          # DIAG jumper na M1

#####################################################################
#      Y Stepper Settings - SLOT 3 (48V TMC5160)
#####################################################################

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 400  # 0.9° motory
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 40
homing_retract_dist: 0

[tmc5160 stepper_y]
cs_pin: PB9
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: False
run_current: 1.1
sense_resistor: 0.075
driver_SGT: 1
diag1_pin: ^!PF2          # DIAG jumper na M3 (POZOR: je to pin PF2 pre Slot 3!)
