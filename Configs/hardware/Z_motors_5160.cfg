#####################################################################
#      Z Steppers (4x TMC5160 - Quad Gantry Level), alebo
#            4 nezávislé motory pre QGL - SPI Mode
#      Z Stepper Settings - SLOT 5, 6, 7, 8 (24V TMC5160)
#####################################################################

## Z0 Stepper - Front Left (Slot 5)
[stepper_z]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 300
position_min: -5
homing_speed: 15 # Pri 5160 môžeš ísť trochu svižnejšie

[tmc5160 stepper_z]
cs_pin: PG14
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

## Z1 Stepper - Rear Left (Slot 6)
[stepper_z1]
step_pin: PG9
dir_pin: !PD7
enable_pin: !PG11
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc5160 stepper_z1]
cs_pin: PG10
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

## Z2 Stepper - Rear Right (Slot 7)
[stepper_z2]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc5160 stepper_z2]
cs_pin: PD5
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

## Z3 Stepper - Front Right (Slot 8)
[stepper_z3]
step_pin: PC7
dir_pin: !PC8
enable_pin: !PD2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc5160 stepper_z3]
cs_pin: PC6
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0
