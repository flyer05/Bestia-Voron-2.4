#####################################################################
#      Z Stepper Settings - SLOT 5, 6, 7, 8 (24V TMC2209)
#####################################################################

## Z0 Stepper - Front Left (Slot 5)
[stepper_z]
step_pin: PB3
dir_pin: PD2
enable_pin: !PA15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop # Sensorless na Z sa neodporúča pre homing, používa sa sonda
position_max: 300
position_min: -5
homing_speed: 8
second_homing_speed: 3

[tmc2209 stepper_z]
uart_pin: PD5
interpolate: True
run_current: 0.8
sense_resistor: 0.110
# Ak sensorless aj tu:
# diag_pin: ^PC0  # Pin pre M5-STOP
# driver_SGTHRS: 100 

## Z1 Stepper - Rear Left (Slot 6)
[stepper_z1]
step_pin: PA1
dir_pin: !PA3
enable_pin: !PA4
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PA2
interpolate: True
run_current: 0.8
sense_resistor: 0.110

## Z2 Stepper - Rear Right (Slot 7)
[stepper_z2]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PD6
interpolate: True
run_current: 0.8
sense_resistor: 0.110

## Z3 Stepper - Front Right (Slot 8)
[stepper_z3]
step_pin: PD7
dir_pin: !PD6
enable_pin: !PB3
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PB4
interpolate: True
run_current: 0.8
sense_resistor: 0.110
