# ======================================================================
# VORON 2.4 - MANTA M8P V2.0 + SB2240 CONFIGURATION
# ======================================================================
# VORON 2.4 350mm "Beštia" - Config Revízia 2.0
# Hardware: Manta M8P V2, CB2, 6x TMC5160T Pro, SB2240 CAN
# X/Y: 48V, 0.9deg motory, Sensorless Homing
# Z: 24V, 1.8deg motory
# Extruder: Rapido UHF, CNC Tap
# Importovanie externých konfiguračných súborov
[include mainsail.cfg]    # Základné príkazy pre webové rozhranie Mainsail
[include sb2240.cfg]      # Konfigurácia tvojej CAN zbernice a toolheadu
#[include quad_gantry_level.cfg]
# [include KlipperScreen.conf] <--- TENTO RIADOK ZAKOMENTUJ (pridaj #) ALEBO VYMAŽ
#[include moonraker_obico_macros.cfg]
#[include timelapse.cfg]   #pripojenie kamery
#[include stealthburner_leds.cfg]
#[include sensors.cfg]

[board_pins manta_m8p_v2]
aliases:
# --- MOTORY (Stepper Drivers) ---
    M1_STEP=PE6,  M1_DIR=PE5,  M1_EN=PC14,  M1_CS=PC13,
    M2_STEP=PE2,  M2_DIR=PE1,  M2_EN=PE4,   M2_CS=PE3,
    M3_STEP=PB8,  M3_DIR=PB7,  M3_EN=PE0,   M3_CS=PB9,
    M4_STEP=PB4,  M4_DIR=PB3,  M4_EN=PB6,   M4_CS=PB5,
    M5_STEP=PG13, M5_DIR=PG12, M5_EN=PG15,  M5_CS=PG14,
    M6_STEP=PG9,  M6_DIR=PD7,  M6_EN=PG11,  M6_CS=PG10,
    M7_STEP=PD4,  M7_DIR=PD3,  M7_EN=PD6,   M7_CS=PD5,
    M8_STEP=PC7,  M8_DIR=PC8,  M8_EN=PD2,   M8_CS=PC6,
# --- OHREVY A TERMISTORY ---
    BED_OUT=PF5,  BED_TEMP=PB1,
    HE0=PA0,      T0=PB0,
    HE1=PA1,      T1=PC5,
    HE2=PA3,      T2=PC4,
    HE3=PA5,      T3=PA7,
# --- VENTILÁTORY ---
    FAN0=PF7,  FAN1=PF9,  FAN2=PF6,  FAN3=PF8,  FAN4=PA4,
    FAN5=PA6,  FAN6=PA2,
# --- OSTATNÉ A CAN ---
    RGB=PD15,      PROBE=PD13,
    I2C_SCL=PA8,   I2C_SDA=PC9,
    CAN_TX=PD0,    CAN_RX=PD1
    
# ======================================================================
#  Definícia MCU (Dosiek)
# ======================================================================

# Hlavná doska Manta M8P V2 (Riadi X, Y, Z motory a Bed)
[mcu]
# Ziskajte prikazom: ~/klipper/scripts/canbus_query.py can0
# Tu musite dat spravne UUID, ktore zistite cez "canbus_query.py"
# Ak mate Mantu ako CAN bridge, bude to CAN UUID.
canbus_uuid: (DOPLNIŤ TVOJE UUID)


# 2. Toolhead doska SB2240 (Extruder, Hotend, Fans, Probe, X-Endstop)
[mcu sb2240]
#canbus_uuid: VASE_DRUHE_UUID # Toto bude pre SB2240 (keď ho pripojíš)
canbus_uuid: (DOPLNIŤ TVOJE UUID)

# 3. Host (CB2) - pre teplotu systemu
[mcu host CB2]
serial: /tmp/klipper_host_mcu
#serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_48002E001951313434373135-if00

# ======================================================================
# Nastavenia Tlačiarne (Kinematika)
# VORON 2.4 - MANTA M8P V2.0 + SB2240 CONFIGURATION
# ======================================================================

[printer]
kinematics: corexy            # Typ pohybu tlačiarne (CoreXY pre Voron)
max_velocity: 300             # Maximálna rýchlosť v mm/s
#max_velocity: 500
max_accel: 3000               # Maximálne zrýchlenie v mm/s²
#max_accel: 10000             # S TMC5160 a 48V mozete ist casom vyssie (napr. 15-20k)
max_z_velocity: 15            # Rýchlosť pohybu osi Z
max_z_accel: 350              # Zrýchlenie osi Z
square_corner_velocity: 5.0   # Rýchlosť prejazdu cez rohy

# Teploty elektroniky (Info pre Mainsail)
[temperature_sensor CB2]
sensor_type: temperature_host

[temperature_sensor MCU_Manta]
sensor_type: temperature_mcu
