#####################################################################
#  KlipperScreen.cfg - PROJEKT BEŠTIA (Voron 2.4)
#####################################################################

[main]
# Nastavenie jazyka
language: sk

# Orientácia obrazovky (ak máš displej na výšku, zmeň na 'portrait')
screen_blanking: 900
confirm_estop: True
show_heater_power: True

[printer Bestia]
# Definuje zobrazenie pre tvoj Voron
moonraker_host: 127.0.0.1
moonraker_port: 7125

# Definuj, ktoré teploty majú byť prioritne v grafoch
titlebar_items: Chamber, MCU_Temp

# Vlastné rozloženie teplôt na hlavnej obrazovke
[preheat ABS]
extruder: 245
heater_bed: 110
chamber: 40

[preheat ASA]
extruder: 250
heater_bed: 110

[preheat PLA]
extruder: 210
heater_bed: 60

#####################################################################
#  MONITORING SENZOROV (Zobrazenie tvojich AHT10 a driverov)
#####################################################################

[menu __main monitoring]
name: Monitoring
icon: info
panel: history

[display_status]

# Tu nadefinuj, ktoré senzory sa majú zobrazovať na hlavnom paneli
[graph Bestia]
# Zobrazí grafy pre tieto komponenty
sensors: extruder, heater_bed, Chamber, Electronics_Bay, Motor_X_Temp

#####################################################################
#  VLASTNÉ MAKRO TLAČIDLÁ (Rýchly prístup)
#####################################################################

[menu __main homing_sensorless]
name: Sensorless Home
icon: home
method: printer.gcode.script
params: {"script":"G28"}

[menu __main qgl_tap]
name: QGL (TAP)
icon: level
method: printer.gcode.script
params: {"script":"QUAD_GANTRY_LEVEL"}
