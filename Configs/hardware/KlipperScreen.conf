######################################################################
#  KlipperScreen - PROJEKT BEŠTIA (Voron 2.4)
#####################################################################

[main]
# Nastavenie prostredia
language: sk
theme: material-dark
font_size: small
screen_blanking: 900
confirm_estop: True
show_heater_power: True

[printer Bestia]
# Definuje pripojenie k tvojmu Voronu
moonraker_host: 127.0.0.1
moonraker_port: 7125

#####################################################################
#  Predhrievacie profily (Preheat)
#####################################################################

[preheat ABS]
extruder: 245
heater_bed: 110
## Ak by si chcel zapnúť aj Nevermore filter pri predhreve, dalo by sa to pridať sem cez gcode
gcode: SET_FAN_SPEED FAN=nevermore SPEED=1.0

[preheat ASA]
extruder: 250
heater_bed: 110
gcode: SET_FAN_SPEED FAN=nevermore SPEED=1.0

[preheat PLA]
extruder: 210
heater_bed: 60

#####################################################################
#  VLASTNÉ MENU A TLAČIDLÁ NA DISPLEJI
#####################################################################

# Pridá tlačidlo na hlavnú obrazovku, ktoré ťa hodí priamo do grafov a teplôt
[menu __main monitoring]
name: Monitoring
icon: thermometer
panel: temperature

